spring.application.name=fintech-backend
server.port=${SERVER_PORT:8080}

# La aplicación inicia en memoria, sin requerir MySQL.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Para reactivar MySQL/JPA, comenta la exclusión anterior y configura las
# variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME y DB_PASSWORD.
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# --- MySQL (todo se configura por variables de entorno; no hay credenciales reales aquí) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fintechdigital}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# El esquema se crea con database/script.sql, Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CORS: orígenes permitidos para el frontend (separados por coma) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
